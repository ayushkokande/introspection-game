[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "introspect"
version = "0.1.0"
description = "Knowing What You Know: an adversarial RL game for introspective confidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayush Kokande" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# T2 (knowledge editing) and Section 4 (benchmark RL). Pinned loosely; fix versions once the model family is chosen.
llm = [
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.11",
    "datasets>=2.20",
    "accelerate>=0.33",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
